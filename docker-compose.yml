services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.13.6
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mydatabase
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SPRING_DATA_REDIS_HOST: redis
      AI_SERVICE_URL: http://ai-service:8000
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env}

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      - redis
      - qdrant
    env_file:
      - ./ai-service/.env
    environment:
      QDRANT_URL: http://qdrant:6333
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SPRING_BOOT_URL: http://backend:8080
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env}
    volumes:
      - shared_uploads:/tmp/uploads

  celery-worker:
    build: ./ai-service
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info
    depends_on:
      - redis
      - qdrant
    env_file:
      - ./ai-service/.env
    environment:
      QDRANT_URL: http://qdrant:6333
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SPRING_BOOT_URL: http://backend:8080
    volumes:
      - shared_uploads:/tmp/uploads

  flower:
    image: mher/flower:2.0.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env}/api
    restart: unless-stopped
    depends_on:
      - backend

  n8n:
    image: n8nio/n8n:1.94.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - backend

  caddy:
    image: caddy:2.9.1
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  qdrant_data:
  n8n_data:
  shared_uploads:
  caddy_data:
  caddy_config:
