spring.application.name=smartspend
# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/mydatabase
spring.datasource.username=myuser
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=${JWT_SECRET}

# Server
server.port=8080

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# AI Service
ai.service.url=http://localhost:8000

# n8n (both optional; alerts work in-app without them)
n8n.alert-webhook-url=${N8N_ALERT_WEBHOOK_URL:}
n8n.service-token=${N8N_SERVICE_TOKEN:}

# CORS
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}